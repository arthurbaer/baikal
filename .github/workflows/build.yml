name: build-baikal-image
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Baikal-Tag (z. B. 0.13.0)"
        default: "0.13.0"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BAIKAL_VERSION=${{ inputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/baikal:${{ inputs.version }}
            ghcr.io/${{ github.repository_owner }}/baikal:latest
