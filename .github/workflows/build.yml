name: build-baikal-image
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Baikal-Version (Git-Tag aus github.com/sabre-io/Baikal/tags)"
        default: "latest"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: BAIKAL_VERSION=${{ inputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/baikal:${{ inputs.version }}
            ghcr.io/${{ github.repository_owner }}/baikal:latest
